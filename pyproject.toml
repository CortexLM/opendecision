[project]
name = "opendecision"
version = "0.1.0"
description = "Non-LLM, parallel, multimodal typed-decision engine: JSON probabilities in one forward pass."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.3", "pydantic>=2.5", "numpy"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn"]
hf = ["transformers>=4.45", "pillow"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendecision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
